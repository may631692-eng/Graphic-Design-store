<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="description" content="আপনার মনের মতো গ্রাফিক ডিজাইন কিনুন, এডিট করান বা নতুন করে বানিয়ে নিন।"><meta name="theme-color" content="#faf6ef"><title>Graphic Design</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Noto+Serif+Bengali:wght@600;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><style id="css">
:root{--bg:#f6efe4;--card:#fffaf2;--tx:#2b1a0f;--mut:#86705b;--bd:#e4d3bb;--ac:#9a6a1c;--on:#fff;--sh:rgba(43,26,15,.30);--gold:linear-gradient(135deg,#dcb865 0%,#b78a2c 50%,#8f6410 100%);--btn:#2b1a0f;--btnx:#f6e7c4;--hero:linear-gradient(155deg,#2d1b10 0%,#140b06 100%);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17100a;--card:#21170f;--tx:#f4eadb;--mut:#b8a68f;--bd:#3d2d1d;--ac:#dcb865;--on:#1a110a;--sh:rgba(0,0,0,.55);--gold:linear-gradient(135deg,#f0d98f 0%,#d4a940 55%,#a97a1f 100%);--btn:linear-gradient(135deg,#e8cc83,#c79a3a);--btnx:#1a110a;--hero:linear-gradient(155deg,#241710 0%,#0e0805 100%)}}
:root[data-theme="dark"]{--bg:#17100a;--card:#21170f;--tx:#f4eadb;--mut:#b8a68f;--bd:#3d2d1d;--ac:#dcb865;--on:#1a110a;--sh:rgba(0,0,0,.55);--gold:linear-gradient(135deg,#f0d98f 0%,#d4a940 55%,#a97a1f 100%);--btn:linear-gradient(135deg,#e8cc83,#c79a3a);--btnx:#1a110a;--hero:linear-gradient(155deg,#241710 0%,#0e0805 100%)}
html{scroll-behavior:smooth;scroll-padding-top:calc(84px + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 420px at 50% -140px,color-mix(in srgb,#d9b25f 16%,transparent),transparent) no-repeat,var(--bg);color:var(--tx);font:400 16px/1.7 "Hind Siliguri",system-ui,"Noto Sans Bengali",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,.brand,.tag{font-family:"Playfair Display","Noto Serif Bengali",Georgia,serif}
::selection{background:#dcb865;color:#1a110a}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
select,input,textarea{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:9px 14px;min-height:46px;transition:border-color .2s,box-shadow .2s}
select:focus,input:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent);outline:0}
textarea{width:100%;resize:vertical}
input[type=checkbox]{min-height:0;width:auto}
#ofr{margin:0 -20px;padding:9px 20px;background:linear-gradient(90deg,#a97a1f,#ecd48f 50%,#a97a1f);color:#1a110a;text-align:center;font-weight:700;font-size:14px;letter-spacing:.03em}
#ofr[hidden]{display:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;gap:8px;padding:12px 20px;margin:0 -20px;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px);border-bottom:1px solid color-mix(in srgb,var(--ac) 22%,var(--bd));transition:box-shadow .3s}
header.sc{box-shadow:0 10px 36px var(--sh)}
.logo{width:44px;height:44px;object-fit:contain;flex:none;transition:transform .9s}.logo:hover{transform:rotate(90deg)}
.brand{font-size:17px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
@media (max-width:620px){.brand{display:none}}
header select{margin-inline-start:auto;min-height:42px;padding:6px 10px;max-width:96px;font-size:14px;border-radius:999px}
@media (max-width:430px){header select{max-width:84px;padding:6px 6px;font-size:13px}.login{padding:9px 12px;font-size:13px}}
.tgl{width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:var(--card);cursor:pointer;display:grid;place-items:center;font-size:19px;line-height:1;padding:0;flex:none;color:var(--ac)}
#acct{position:relative}
.login,.btn2,.buy,.opt.pri,.ptab.on,.chip.on{background:var(--btn);color:var(--btnx);border:0;box-shadow:0 8px 22px color-mix(in srgb,#000 22%,transparent)}
.login,.btn2{border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;min-height:42px;white-space:nowrap;transition:all .25s}
.login{font-size:14px;padding:10px 14px}
.login:hover,.btn2:hover,.buy:hover,.opt.pri:hover{background:var(--gold);color:#1a110a}
.avatar{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--ac);background:var(--card);color:var(--ac);font-weight:700;font-size:17px;cursor:pointer}
#menu{position:absolute;inset-inline-end:0;top:56px;width:260px;background:var(--card);border:1px solid color-mix(in srgb,var(--ac) 28%,var(--bd));border-radius:18px;padding:8px;z-index:5;box-shadow:0 24px 60px var(--sh)}
#menu small{display:block;color:var(--mut);overflow-wrap:anywhere}
#menu .who{padding:8px 10px 10px;border-bottom:1px solid var(--bd);margin-bottom:4px}
#menu button{display:block;width:100%;text-align:start;background:none;border:0;padding:10px;border-radius:10px;cursor:pointer}
#menu button:hover{background:color-mix(in srgb,var(--ac) 10%,transparent)}
#menu .lbl{color:var(--mut);font-size:13px;padding:6px 10px 0}
#menu button.cur{font-weight:700;color:var(--ac)}
#menu[hidden]{display:none}
.nav{display:flex;gap:28px;overflow-x:auto;border-bottom:1px solid var(--bd);scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:16px 0;font-weight:600;cursor:pointer;color:var(--mut);position:relative;letter-spacing:.04em;transition:color .2s}
.tab::after{content:"";position:absolute;inset-inline:0;bottom:-1px;height:2px;background:var(--gold);transform:scaleX(0);transition:transform .3s}
.tab:hover{color:var(--tx)}.tab.on{color:var(--tx)}.tab.on::after{transform:scaleX(1)}
.hero{position:relative;overflow:hidden;margin:24px 0 8px;padding:56px 28px 40px;border-radius:30px;background:var(--hero);color:#f6ecda;border:1px solid rgba(220,184,101,.28)}
.hero::before{content:"";position:absolute;width:520px;height:520px;inset-inline-end:-190px;top:-210px;border-radius:50%;background:radial-gradient(circle,rgba(224,189,106,.36),transparent 65%)}
.hero::after{content:"";position:absolute;width:300px;height:300px;inset-inline-end:-70px;bottom:-130px;border-radius:50%;border:1px solid rgba(220,184,101,.32);box-shadow:0 0 0 38px rgba(220,184,101,.06),0 0 0 76px rgba(220,184,101,.04)}
.hero>*{position:relative;z-index:1}
h1{margin:0;font-size:clamp(46px,11.5vw,104px);line-height:1;font-weight:700;letter-spacing:-.01em}
.hero h1{color:#f8efdc}
.tag{margin:14px 0 0;font-size:clamp(21px,4.6vw,32px);font-style:italic;font-weight:600;background:linear-gradient(135deg,#f6e2a2,#d4a940);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.chips{display:flex;gap:6px;margin-top:30px}.chips i{width:46px;height:3px;border-radius:2px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.opt{display:block;width:100%;text-align:center;text-decoration:none;border:1px solid color-mix(in srgb,var(--ac) 35%,var(--bd));border-radius:999px;padding:12px 24px;margin-bottom:10px;font-weight:600;letter-spacing:.02em;color:var(--tx);background:transparent;cursor:pointer;min-height:48px;transition:all .25s}
.opt:hover{border-color:var(--ac);color:var(--ac)}
.opt.pri{border-color:transparent}
.hero .opt{width:auto;display:inline-block;margin:0;padding:13px 28px;color:#f8efdc;border-color:rgba(248,239,220,.36)}
.hero .opt:hover{border-color:#dcb865;color:#dcb865}
.hero .opt.pri{background:linear-gradient(135deg,#f3dc9a,#c79a3a);color:#1a110a;border:0}
.hero .opt.pri:hover{color:#1a110a;filter:brightness(1.08)}
button:active,.opt:active,.buy:active{transform:scale(.98)}
.chips2{display:flex;gap:10px;overflow-x:auto;padding:30px 0 6px;scrollbar-width:none}
.chips2::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--bd);background:transparent;border-radius:999px;padding:9px 20px;cursor:pointer;font-weight:600;white-space:nowrap;transition:all .25s}
.chip:hover{border-color:var(--ac);color:var(--ac)}
.chip.on{border-color:transparent}
#typ{display:none}
.filters{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;padding:18px 0 10px}
.filters label{display:flex;align-items:center;gap:10px;color:var(--mut)}
.filters input,.filters select{background:transparent;border:0;border-bottom:1px solid var(--bd);border-radius:0;padding:8px 2px;min-height:44px}
.filters input:focus,.filters select:focus{box-shadow:none;border-bottom-color:var(--ac)}
.filters input{width:84px}.filters #q{width:100%;max-width:300px}
#note{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-bottom:16px;color:var(--mut);font-size:14px;letter-spacing:.03em}
#note button{background:none;border:1px solid var(--bd);border-radius:999px;padding:4px 14px;cursor:pointer}
#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:28px 14px}
@media (min-width:720px){#grid{grid-template-columns:repeat(3,1fr);gap:44px 28px}}
@media (min-width:1040px){#grid{grid-template-columns:repeat(4,1fr)}}
.card{display:flex;flex-direction:column;animation:up .6s ease both}
.card:nth-child(2){animation-delay:.07s}.card:nth-child(3){animation-delay:.14s}.card:nth-child(4){animation-delay:.21s}
.art{--c:#6f4426;position:relative;aspect-ratio:4/5;overflow:hidden;cursor:zoom-in;border-radius:16px;box-shadow:0 16px 40px var(--sh);background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 40%,#fff));display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px;text-shadow:0 1px 6px rgba(0,0,0,.35);text-align:center;padding:10px;transition:transform .45s,box-shadow .45s}
.card:hover .art{transform:translateY(-6px);box-shadow:0 30px 60px var(--sh)}
.pic{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .9s}
.card:hover .pic{transform:scale(1.06)}
.wm::after{content:"GRAPHIC DESIGN";position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.5);text-shadow:0 0 3px rgba(0,0,0,.45);font-weight:700;font-size:16px;letter-spacing:.2em;transform:rotate(-24deg);pointer-events:none}
.fav{z-index:2;position:absolute;inset-inline-end:12px;bottom:12px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.94);color:#b0294f;font-size:20px;cursor:pointer;line-height:1;box-shadow:0 6px 16px rgba(0,0,0,.25);transition:transform .2s}
.fav:hover{transform:scale(1.1)}
.nb{position:absolute;top:12px;inset-inline-start:12px;background:var(--gold);color:#1a110a;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-style:normal;padding:5px 12px;border-radius:999px;z-index:2}
.so{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,12,6,.58);color:#fff;font-weight:700;letter-spacing:.14em;text-transform:uppercase;z-index:1;font-style:normal;pointer-events:none}
.body{padding:18px 2px 0;display:flex;flex-direction:column;gap:3px;flex:1}
.ty{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ac);font-weight:600}
.body h3{margin:0;font-size:23px;font-weight:700;line-height:1.2}
.pr{margin:2px 0 16px;font-size:18px;font-weight:600;color:var(--ac)}
.pr s{color:var(--mut);font-weight:400;font-size:14px;margin-inline-start:8px}
.pr .off{font-style:normal;background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac);font-size:12px;padding:2px 8px;border-radius:999px;margin-inline-start:8px}
.buy{margin-top:auto;display:block;width:100%;text-align:center;text-decoration:none;font-weight:600;letter-spacing:.03em;border-radius:999px;padding:11px;min-height:46px;cursor:pointer;font-family:inherit;font-size:inherit;transition:all .25s}
.buy.off{background:var(--bd);color:var(--mut);box-shadow:none;cursor:not-allowed}
.empty{grid-column:1/-1;color:var(--mut);padding:36px 0}
.more{text-align:center;padding:40px 0 12px}
.more button{background:none;border:1px solid var(--tx);border-radius:999px;padding:13px 40px;cursor:pointer;font-weight:600;letter-spacing:.05em;transition:all .25s}
.more button:hover{background:var(--btn);color:var(--btnx);border-color:transparent}
.more[hidden],#more[hidden]{display:none}
.how,.pay{padding:56px 0 8px}
.how h2,.pgx h2,.pay h2{position:relative;padding-bottom:16px;margin:0 0 26px;font-size:clamp(32px,6vw,50px);font-weight:700;line-height:1.1}
.how h2::after,.pgx h2::after,.pay h2::after,footer h2::after{content:"";position:absolute;inset-inline-start:0;bottom:0;width:56px;height:3px;border-radius:2px;background:var(--gold)}
.how ol{margin:0;padding:0;list-style:none;display:grid;gap:26px;counter-reset:s}
@media (min-width:720px){.how ol{grid-template-columns:repeat(3,1fr);gap:40px}}
.how li{counter-increment:s;display:block;padding-top:20px;border-top:1px solid color-mix(in srgb,var(--ac) 45%,var(--bd));font-size:18px;animation:up .7s ease both}
.how li::before{content:"0" counter(s);display:block;font-family:"Playfair Display","Noto Serif Bengali",serif;font-size:52px;line-height:1;color:var(--ac);font-weight:700;margin-bottom:8px}
.svc{display:grid;gap:20px;margin:56px 0 8px;grid-template-columns:1fr}
@media (min-width:720px){.svc{grid-template-columns:1fr 1fr;gap:28px}}
.svc>div{background:linear-gradient(160deg,var(--card),color-mix(in srgb,var(--ac) 9%,var(--card)));border:1px solid color-mix(in srgb,var(--ac) 28%,var(--bd));border-radius:24px;padding:30px;animation:up .7s ease both}
.svc h3{margin:0 0 8px;font-size:30px;font-weight:700}.svc p{margin:0;color:var(--mut)}.svc .opt{margin:22px 0 0}
#paylist{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.payb{display:flex;align-items:center;gap:12px;text-align:start;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px 18px;cursor:pointer;transition:border-color .25s}
.payb:hover{border-color:var(--ac)}.payb b{font-size:17px}.payb span{flex:1;color:var(--mut);font-variant-numeric:tabular-nums}.payb i{font-style:normal;font-size:12px;color:var(--ac);font-weight:700}
#paynote{color:var(--mut);margin:12px 0 0}
.pgx{padding:44px 0;max-width:700px}.pgx p{color:var(--mut)}.pgx h3{margin:34px 0 14px;font-size:26px}
#aboutTxt p{font-size:18px;color:var(--tx);margin:0 0 16px}
.of{display:grid;gap:14px;margin-top:20px}.of input,.of select,.of textarea{width:100%;margin:0}.of .opt{margin:0}
details{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px 20px;margin-bottom:12px}
summary{font-weight:600;cursor:pointer}details p{margin:10px 0 0}
footer{background:linear-gradient(160deg,#261810,#130b06);color:#f4ece1;border-radius:30px;padding:38px 28px;margin:64px 0 16px;border:1px solid #4a3622;position:relative;overflow:hidden}
footer::before{content:"";position:absolute;width:340px;height:340px;inset-inline-end:-120px;top:-150px;border-radius:50%;background:radial-gradient(circle,rgba(224,189,106,.22),transparent 65%)}
footer>*{position:relative}
footer h2{position:relative;font-size:32px;padding-bottom:14px;margin:0 0 20px;color:#f6ecda}
.fnote{margin:0 0 18px;color:rgba(244,236,225,.75)}.fnote:empty{display:none}
.soc{display:flex;flex-direction:column;align-items:flex-start;gap:12px}
@media (min-width:720px){.soc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%}}
.soc a{display:flex;align-items:center;gap:12px;text-decoration:none;color:#f4ece1;border:1px solid rgba(244,236,225,.18);background:rgba(255,255,255,.05);border-radius:16px;padding:9px 20px 9px 10px;min-height:52px;transition:all .25s}
.soc a:hover{border-color:#dcb865;background:rgba(220,184,101,.12)}
.soc b{width:32px;height:32px;border-radius:50%;background:var(--gold);color:#1a110a;display:grid;place-items:center;font-size:14px}
.cp{margin:26px 0 0;color:rgba(244,236,225,.6);font-size:13px;letter-spacing:.04em}
.adm{text-align:center;padding:0 0 104px}
.adm button{background:none;border:0;color:var(--mut);font-size:13px;cursor:pointer;padding:8px 14px;min-height:36px;text-decoration:underline}
body.isadmin .nav,body.isadmin footer,body.isadmin .adm,body.isadmin .fab,body.isadmin #ofr{display:none}
#modal,#mailbox,#pw,#lb,#cart{position:fixed;inset:0;background:rgba(14,8,4,.66);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;z-index:10}
#modal[hidden],#mailbox[hidden],#pw[hidden],#lb[hidden],#cart[hidden],#cartbar[hidden],#toast[hidden]{display:none}
.box{position:relative;background:var(--card);border:1px solid color-mix(in srgb,var(--ac) 30%,var(--bd));border-radius:26px;padding:28px 26px 24px;width:100%;max-width:400px;max-height:calc(100vh - 32px);overflow-y:auto;box-shadow:0 40px 90px rgba(0,0,0,.4);animation:up .35s ease both}
.box h2{margin:0 0 8px;font-size:30px;padding-inline-end:44px}.box p{margin:0 0 14px;color:var(--mut)}.box input{width:100%;margin-bottom:12px}
.box input[type=checkbox]{width:auto;min-height:0;margin:0 8px 0 0;vertical-align:middle}
.xbtn{position:absolute;top:12px;inset-inline-end:12px;width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:var(--tx);font-size:24px;line-height:1;cursor:pointer;z-index:3;display:grid;place-items:center;padding:0}
.xbtn:hover{border-color:var(--ac);color:var(--ac)}
.row{display:flex;gap:10px;justify-content:flex-end}
.row button{border-radius:999px;padding:9px 18px;cursor:pointer;min-height:44px;border:1px solid var(--bd);background:none}
.row .btn2{border:0}
#lbw{aspect-ratio:auto;height:min(72vw,38vh);margin-bottom:14px;border-radius:18px;overflow:hidden;cursor:default;box-shadow:none}
#lbw .pic{object-fit:contain;background:var(--card)}
.lbnav{display:flex;justify-content:space-between;margin:-4px 0 12px}
.lbnav button{width:56px;height:40px;border:1px solid var(--bd);background:var(--card);border-radius:999px;font-size:22px;cursor:pointer;color:var(--tx)}
.lbhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 4px}.lbhead h2{margin:0;padding:0}
.lbfav{flex:none;width:46px;height:46px;border-radius:50%;border:1px solid var(--bd);background:var(--card);font-size:22px;color:#b0294f;cursor:pointer;line-height:1}
.lbfav.on{background:color-mix(in srgb,#b0294f 12%,var(--card));border-color:#b0294f}
#lbp{font-size:18px;font-weight:600;color:var(--ac)}#lbp s{color:var(--mut);font-weight:400;font-size:14px}
.box .lbd{color:var(--tx)}.lbd:empty{display:none}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--btn);color:var(--btnx);padding:12px 22px;border-radius:999px;font-weight:600;z-index:12;box-shadow:0 14px 36px rgba(0,0,0,.35);white-space:nowrap}
.fab{position:fixed;inset-inline-end:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;font-size:26px;text-decoration:none;box-shadow:0 12px 30px rgba(37,211,102,.45);z-index:7;transition:transform .2s}
.fab:hover{transform:scale(1.08)}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.adminpg{max-width:780px;margin:0 auto;padding:22px 0 160px}
.adminpg>.pbody{padding:0}
.adminpg h2{font-size:clamp(30px,6vw,42px);margin:10px 0 14px}
.phd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}.phd .opt{width:auto;margin:0;padding:8px 18px;min-height:42px}
#dirty{font-size:12px;font-weight:700;color:#c2410c;background:color-mix(in srgb,#c2410c 12%,transparent);padding:3px 10px;border-radius:999px;white-space:nowrap}
#dirty[hidden],.addf[hidden]{display:none}
.ptabs{display:flex;gap:8px;overflow-x:auto;margin:6px 0 18px;scrollbar-width:none}

(function(){
  const prog=$("#prog"),up=$("#up"),hd=$("header");
  const onScroll=()=>{const h=document.documentElement,max=h.scrollHeight-h.clientHeight,y=window.scrollY;prog.style.transform="scaleX("+(max>0?Math.min(1,y/max):0)+")";up.hidden=y<700;hd.classList.toggle("sc",y>8)};
  window.addEventListener("scroll",onScroll,{passive:true});onScroll();
  up.onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
  const calm=matchMedia("(prefers-reduced-motion:reduce)").matches;
  if("IntersectionObserver" in window&&!calm){
    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.1,rootMargin:"0px 0px -5% 0px"});
    document.querySelectorAll(".how h2,.how li,.svc>div,.pay h2,footer").forEach((el,i)=>{el.classList.add("rvl");el.style.transitionDelay=(i%3)*100+"ms";io.observe(el)});
  }
  const hero=document.querySelector(".hero");
  hero.addEventListener("pointermove",e=>{const r=hero.getBoundingClientRect();hero.style.setProperty("--mx",((e.clientX-r.left)/r.width*100).toFixed(1)+"%");hero.style.setProperty("--my",((e.clientY-r.top)/r.height*100).toFixed(1)+"%")});
  if(matchMedia("(hover:hover) and (pointer:fine)").matches){
    const g=$("#grid");
    g.addEventListener("pointermove",e=>{const a=e.target.closest(".art");if(!a)return;const r=a.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
      a.style.setProperty("--ry",((x-.5)*9).toFixed(2)+"deg");a.style.setProperty("--rx",((.5-y)*9).toFixed(2)+"deg");a.style.setProperty("--gx",(x*100).toFixed(0)+"%");a.style.setProperty("--gy",(y*100).toFixed(0)+"%")});
    g.addEventListener("pointerout",e=>{const a=e.target.closest(".art");if(a&&!a.contains(e.relatedTarget)){a.style.removeProperty("--rx");a.style.removeProperty("--ry")}});
  }
  document.addEventListener("pointerdown",e=>{
    const b=e.target.closest(".opt,.buy,.login,.chip,.btn2");if(!b||b.classList.contains("off"))return;
    const r=b.getBoundingClientRect(),z=Math.max(r.width,r.height)*1.4,d=document.createElement("span");
    d.className="rip";d.style.cssText="width:"+z+"px;height:"+z+"px;left:"+(e.clientX-r.left-z/2)+"px;top:"+(e.clientY-r.top-z/2)+"px";
    b.appendChild(d);setTimeout(()=>d.remove(),700);
  });
})();
